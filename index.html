<script>
(function () {
  var win = document.getElementById('aiWin');
  var fab = document.getElementById('aiFab');
  var msgs = document.getElementById('aiMsgs');
  var text = document.getElementById('aiText');
  var quick = document.getElementById('aiQuick');

  // 中英文跟随网站语言（切换语言会整页刷新，这里只在载入时读一次）
  var AI_LANG = (function () {
    try { return localStorage.getItem('yuki-lang') === 'en' ? 'en' : 'zh'; } catch (e) { return 'zh'; }
  })();
  function T(zh, en) { return AI_LANG === 'en' ? en : zh; }

  fab.setAttribute('aria-label', T('打开小助手ovo', 'Open Assistant ovo'));
  win.setAttribute('aria-label', T('小柚助手', "Yuki's Assistant"));
  document.getElementById('aiClose').setAttribute('aria-label', T('关闭聊天', 'Close chat'));
  document.getElementById('aiSend').setAttribute('aria-label', T('发送', 'Send'));
  text.placeholder = T('输入问题，回车发送', 'Type a question and press Enter');

  var QUICK = T(
    ['网站怎么用', '色卡', '小铺', '网站功能'],
    ['How to use the site', 'Color Cards', 'My Shop', 'Site features']
  );
  var FALLBACK = T('我现在还是测试版本，暂时只回答少量网站相关问题。', "I'm still a test version, so I can only answer a few questions about the site for now.");

  // ── 知识库（数据库 ai_kb 表 · 后台添加的所有访客都能读到；断网/未建表时退回本地缓存）──
  var KB = (function () { try { return JSON.parse(localStorage.getItem('yuki-ai-kb') || '[]') || []; } catch (e) { return []; } })();
  var KB_DB_OK = false;
  function kbAll() { return KB; }
  function kbLoad() {
    return fetch(DB_BASE + 'ai_kb?select=id,q,a&order=id.asc&limit=200', { headers: DB_HEADERS })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (rows) {
        if (!Array.isArray(rows)) throw new Error('bad');
        KB = rows.map(function (x) { return { id: 'kb-' + x.id, dbId: x.id, q: x.q, a: x.a }; });
        KB_DB_OK = true;
        try { localStorage.setItem('yuki-ai-kb', JSON.stringify(KB)); } catch (e) {} // 缓存兑底
      })
      .catch(function () { KB_DB_OK = false; }); // 未建表/断网：沿用本地缓存，不阻塞聊天
  }
  kbLoad();
  function kbSaveUse(k) { // 使用计数：写数据库日志（失败静默，不影响回复）
    if (!k || !k.dbId || !KB_DB_OK) return;
    fetch(DB_BASE + 'ai_kb_uses', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }, body: JSON.stringify({ kb_id: k.dbId }) }).catch(function () {});
  }
  function normQ(s) { return String(s || '').toLowerCase().replace(/[\s，。？！?!,.'\"“”‘’、~～·：:;；]/g, ''); }
  function bigrams(s) { var r = []; for (var i = 0; i < s.length - 1; i++) r.push(s.substr(i, 2)); return r; }
  function similar(a, b) {
    if (!a || !b) return 0;
    if (a.indexOf(b) > -1 || b.indexOf(a) > -1) return 1;
    var A = bigrams(a), B = bigrams(b);
    if (!A.length || !B.length) return a === b ? 1 : 0;
    var set = {}; A.forEach(function (x) { set[x] = 1; });
    var hit = 0; B.forEach(function (x) { if (set[x]) hit++; });
    return hit / Math.min(A.length, B.length);
  }
  function kbMatch(q) {
    var nq = normQ(q); if (!nq) return null;
    var best = null, score = 0;
    kbAll().forEach(function (k) {
      var s = similar(nq, normQ(k.q));
      if (s > score) { score = s; best = k; }
    });
    return (best && score >= 0.4) ? best : null;
  }

  // ── 模拟回复（第一阶段；知识库优先 → 内置回复 → 兑底；中英文跟随网站语言）──
  function replyFor(q) {
    var k = kbMatch(q);
    if (k) { kbSaveUse(k); return { text: k.a, kbId: k.dbId || k.id, kbObj: k }; }
    var nq = (q || '').toLowerCase();
    if (/你好|您好|hi|hello|嗨|哈喽/.test(nq)) return { text: T('你好呀～我是小柚助手（测试版）。可以点下面的快捷问题，或直接问我「网站怎么用」「色卡」「小铺」。', "Hi there~ I'm Yuki's Assistant (test version). Tap a quick question below, or ask me 'How to use the site', 'Color Cards' or 'My Shop'."), kbId: null };
    if (/色卡|价目|价格表|color ?card|price/.test(nq)) return { text: T('色卡页面在导航的「色卡」，里面有每张色卡的主图、画师和张数，还有收卡价格和色卡总价。点任意一张卡片可以进入详情查看更多信息。', 'The Color Cards page is in the menu under "Color Cards". Each card shows its cover, artists and count, plus the base price and the card total. Tap any card to see the full details.'), kbId: null };
    if (/小铺|商品|购买|下单|宝贝|shop|buy/.test(nq)) return { text: T('小铺在导航的「小铺」，上架的宝贝按分类展示，点进卡片可以看到介绍和价格，也可以看大家的评价。', 'My Shop is in the menu under "My Shop". Items are grouped by category — open a card for the description and price, and you can read customer reviews there too.'), kbId: null };
    if (/网站怎么用|怎么用|使用|怎么玩|how to use|how does this work/.test(nq)) return { text: T('很简单：顶部导航可以跳转「照片」「BJD」「色卡」「小铺」「提问箱」；主页往下滑能看到色卡展示、照片墙和重要日子。右上角的菜单在手机上也能用。', "It's easy: use the menu at the top right to jump to Photos, BJD, Color Cards, My Shop and the Ask Box. Scroll down the home page to see color cards, the photo gallery and important days. The menu works on phones too."), kbId: null };
    if (/网站|功能|有什么|都有什么|site|feature|what can/.test(nq)) return { text: T('现在网站有这些功能：主页（含日历和重要日子）、照片墙、BJD 档案、色卡展示、小铺、匿名提问箱，还有中英文切换。', 'The site currently has: a home page (with a calendar and important days), a photo gallery, BJD profiles, color cards, my little shop, an anonymous ask box, and Chinese/English switching.'), kbId: null };
    return { text: FALLBACK, kbId: null, fb: true };
  }

  function nowTime() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function addMsg(role, txt, time) {
    var div = document.createElement('div');
    div.className = 'msg ' + (role === 'me' ? 'me' : 'ai');
    var avatar = role === 'me' ? '' : '<div class="m-avatar"><img src="/avatar.jpg" alt=""></div>';
    div.innerHTML = avatar +
      '<div class="bubble">' + txt.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '<span class="time">' + (time || nowTime()) + '</span></div>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function typing(on) {
    var old = document.getElementById('typingMsg');
    if (on && !old) {
      var div = document.createElement('div');
      div.className = 'msg ai'; div.id = 'typingMsg';
      div.innerHTML = '<div class="m-avatar"><img src="/avatar.jpg" alt=""></div>' +
        '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    } else if (!on && old) old.remove();
  }

  // ── 会话记录：本地保存最近 20 个会话（修复之前只留 1 个、超 24h 丢弃的问题）；
  // 同时把每条消息写入数据库副本 ai_chat_msgs（后台「AI 对话」可看真实访客提问；失败不影响本地聊天）──
  function loadLog() {
    try { return JSON.parse(localStorage.getItem('yuki-ai-log') || '[]') || []; } catch (e) { return []; }
  }
  function sessKey() {
    var k = null;
    try { k = sessionStorage.getItem('yuki-ai-session-key'); } catch (e) {}
    if (!k) { k = 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); try { sessionStorage.setItem('yuki-ai-session-key', k); } catch (e) {} }
    return k;
  }
  var curSession = null;
  (function restore() {
    var logs = loadLog();
    if (logs.length && logs[0] && logs[0].msgs && logs[0].msgs.length) {
      curSession = logs[0];
      try { sessionStorage.setItem('yuki-ai-session-key', curSession.key || sessKey()); } catch (e) {}
      curSession.msgs.forEach(function (m) { addMsg(m.role === 'me' ? 'me' : 'ai', m.text, m.time); });
    }
  })();
  function logSession(role, txt, meta) {
    if (!curSession) curSession = { start: Date.now(), key: sessKey(), msgs: [] };
    var m = { role: role, text: txt, time: Date.now() };
    if (meta) { m.kbId = meta.kbId; m.fb = !!meta.fb; }
    curSession.msgs.push(m);
    var logs = loadLog().filter(function (s) { return s.key !== curSession.key; });
    try { localStorage.setItem('yuki-ai-log', JSON.stringify([curSession].concat(logs).slice(0, 20))); } catch (e) {}
    // 数据库副本（后台可看真实提问；失败不弹窗不打扰访客，后台读不到即知）
    if (meta && meta.kbObj) {} // kb 使用已在 replyFor 里记过
    fetch(DB_BASE + 'ai_chat_msgs', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ session_key: curSession.key, role: role === 'me' ? 'user' : 'ai', text: txt, kb_hit: !!(meta && meta.kbId && !meta.fb) })
    }).catch(function () {});
  }

  function send(q) {
    q = (q || '').trim();
    if (!q) return;
    addMsg('me', q);
    logSession('me', q);
    text.value = '';
    typing(true);
    setTimeout(function () {
      typing(false);
      var r = replyFor(q);
      addMsg('ai', r.text);
      logSession('ai', r.text, r);
    }, 700 + Math.random() * 500);
  }

  // ── 开关（× 关闭不刷新，重开保留记录）──
  function openWin() {
    win.classList.add('open');
    setTimeout(function () { text.focus(); }, 260);
  }
  function closeWin() {
    win.classList.remove('open');
  }
  // ── 汉堡菜单联动：默认在视口右下角；点开 index 菜单时，按钮跟随菜单展开的节奏平滑滑到
  // 菜单面板左边（固定间距 10px、贴面板顶部对齐），不会瞬移；关菜单时平滑滑回右下角。
  // 全程圆形不变 ──
  var menuEl = document.getElementById('menu');
  var docked = false;
  function dockToMenu() {
    if (!menuEl) return;
    var prev = fab.style.transform;
    fab.style.transition = 'none';
    fab.style.transform = 'none';
    var fr = fab.getBoundingClientRect(); // 默认（视口右下角）位置
    fab.style.transform = prev;
    void fab.offsetWidth;
    fab.style.transition = '';
    // 菜单展开后的左边缘 = 视口宽 - 菜单面板宽（transform 不影响 offsetWidth，拿到的是最终位置）
    // 只横向移动：垂直位置不变，和右下角默认位保持同一条水平线
    var finalLeft = window.innerWidth - menuEl.offsetWidth;
    var dx = (finalLeft - 10 - fr.width) - fr.left;
    fab.classList.add('docked');
    fab.style.transform = 'translate(' + dx.toFixed(1) + 'px, 0)';
    docked = true;
  }
  function undock() {
    docked = false;
    fab.classList.remove('docked');
    fab.style.transform = '';
  }
  if (menuEl && 'MutationObserver' in window) {
    new MutationObserver(function () {
      if (menuEl.classList.contains('open')) {
        if (win.classList.contains('open')) closeWin(); // 聊天窗收起，不挡菜单
        dockToMenu();
      } else {
        undock();
      }
    }).observe(menuEl, { attributes: true, attributeFilter: ['class'] });
  }
  window.addEventListener('resize', function () { if (docked) dockToMenu(); });

  fab.addEventListener('click', function () {
    if (menuEl && menuEl.classList.contains('open')) { // 菜单开着时点小助手：先收菜单（按钮同步滑回右下角）再开聊天窗
      var b = document.getElementById('burger');
      if (b) b.click();
      openWin();
      return;
    }
    if (win.classList.contains('open')) closeWin(); else openWin();
  });
  document.getElementById('aiClose').addEventListener('click', closeWin);
  document.getElementById('aiSend').addEventListener('click', function () { send(text.value); });
  text.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); send(text.value); } });

  QUICK.forEach(function (q) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = q;
    b.addEventListener('click', function () { send(q); });
    quick.appendChild(b);
  });

  if (!curSession) addMsg('ai', T('你好，我是小柚助手～现在还是测试版，可以先点下面的快捷问题试试。', "Hi, I'm Yuki's Assistant~ I'm still a test version — try a quick question below."), nowTime());
})();
</script>
<script>
  // ===== 主页：预览区 / 设置同步 / 旧链接兼容（子页已拆分为 /photos/ /bjd/ /color-card/）=====
  var BJD_PHOTOS = []; // BJD 照片分区（作主页预览图来源）
  var AREAS_CACHE = [];

  // 主页 BJD 预览：最多 4 只（后台勾选主页展示、可设主页封面），点卡片进 BJD 子页
  function renderBjdHome() {
    var grid = document.getElementById('bjd-home-grid');
    if (!grid) return;
    var all = BJDS_CACHE.map(function (b, i) { return { b: normBjdView(b), i: i }; });
    var flagged = all.filter(function (x) { return x.b.homeShow !== false; }).slice(0, 4); // 只显示勾选「主页展示」的娃，最多四张，无勾选则隐藏区块
    var show = flagged;
    grid.style.display = show.length ? 'grid' : 'none';
    /* 固定 4 列：CSS 已硬编码，不再按项目数均分（她 2026-10-26：2~3 个项目也不拉伸） */
    grid.innerHTML = show.map(function (x) {
      var b = x.b, img = b.cover || b.image;
      var tv = bjdTotalV(b);
      var pvRaw = String((b.price && b.price.total) || '').trim();
      var pv = tv > 0 ? fmtMoney(tv) : (pvRaw !== '' ? fmtPriceText(pvRaw) : '');
      return '<div class="card bjd-card" data-i="' + x.i + '" style="margin-bottom:0;padding:0;overflow:hidden;cursor:pointer;position:relative;display:flex;flex-direction:column;">' +
        (img ? '<div style="width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--card);"><img src="' + escAttrDb(normImg(img)) + '" style="width:100%;height:100%;object-fit:cover;display:block;" alt="BJD" loading="lazy"></div>'
             : '<div style="width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--muted);font-size:15px;">' + (LANG === 'en' ? 'No photo' : '暂无图片') + '</div>') +
        '<div style="padding:10px 12px;display:flex;flex-direction:column;flex:1;">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
        '<b style="flex:1;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escDb(b.name || (LANG === 'en' ? 'Unnamed doll' : '未命名娃娃')) + '</b>' +
        shareBtnHtml(x.i, 'bjd', true) +
        bjdEditBtn(x.i) + // 登录后台后才出现
        '</div>' +
        (b.head.size ? '<div style="font-size:15px;color:var(--muted);margin-top:4px;">' + escDb(LANG === 'en' && window.sizeEnKeep ? sizeEnKeep(b.head.size) : b.head.size) + '</div>' : '') +
        '<div style="display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px;"><span style="flex:1;font-size:17px;color:var(--text,#604C57);font-weight:600;">' + (LANG === 'en' ? 'Total ' : '总价 ') + '</span><span style="color:var(--price,#ff6fa5);font-weight:600;">' + (pv ? '¥' + pv : '—') + '</span></div>' +
        '</div></div>';
    }).join('');
  }

  // 主页精选占位图（数据库没图时兜底）
  document.querySelectorAll('#page-home .photo[data-img]').forEach(function (el) { loadPhoto(el, false); });

  function homePhotoRows() {
    return fetch(DB_BASE + 'photos?select=id,category,image_url,caption_zh,caption_en,pinned,home&order=pinned.desc,sort.asc,created_at.asc&limit=300', { headers: DB_HEADERS })
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
      .catch(function () {
        return dbFetch('photos?select=id,category,image_url,caption_zh,caption_en&order=sort.asc,created_at.asc&limit=300');
      });
  }
  // 瓦片图 + 分区名 + BJD 预览：与后台照片管理同一份数据
  Promise.all([
    dbFetch('photo_sections?select=id,key,name_zh,name_en,sort&order=sort.asc,created_at.asc&limit=100'),
    homePhotoRows()
  ]).then(function (res) {
    var sections = res[0] || [];
    var rows = res[1] || [];
    var groups = {};
    rows.forEach(function (p) { (groups[p.category] = groups[p.category] || []).push(p); });
    var tileGrid = document.querySelector('#sec-gallery .preview-grid');
    ['instax', 'film'].forEach(function (key) {
      var tile = tileGrid && tileGrid.querySelector('[data-sec="' + key + '"] .photo');
      if (!tile) return;
      var list2 = groups[key] || [];
      var pick = list2.filter(function (p) { return p.home; })[0] || list2[0];
      if (pick) { tile.setAttribute('data-img', pick.image_url); loadDbImg(tile, pick.image_url); }
    });
    sections.forEach(function (sec) {
      var list = groups[sec.key] || [];
      if (sec.key === 'bjd') { BJD_PHOTOS = list.map(function (p) { return p.image_url; }); renderBjdHome(); return; }
      if (!tileGrid) return;
      var mt = tileGrid.querySelector('[data-sec="' + sec.key + '"]');
      if (!mt) { // 新分区：自动建瓦片（还没有照片也显示；有独立页的分区直达独立页）
        var PAGE_OF = { bjdselfie: '/bjdselfie/' };
        mt = document.createElement('div');
        mt.className = 'tile';
        mt.setAttribute('data-sec', sec.key);
        mt.innerHTML = '<a class="photo" href="' + (PAGE_OF[sec.key] || '/photos/?sec=' + encodeURIComponent(sec.key)) + '" data-img=""></a><span class="tile-label"></span>';
      }
      var lb = mt.querySelector('.tile-label');
      if (lb) {
        lb.setAttribute('data-zh', sec.name_zh);
        lb.setAttribute('data-en', sec.name_en);
        // 动态渲染晚于 applyLang，这里按当前语言直接给对文字
        lb.textContent = (document.documentElement.lang === 'en' && sec.name_en) ? sec.name_en : sec.name_zh;
      }
      tileGrid.appendChild(mt); // 同步排序
      var pick = list.filter(function (p) { return p.home; })[0] || list[0];
      if (pick) { var a = mt.querySelector('.photo'); a.setAttribute('data-img', pick.image_url); loadDbImg(a, pick.image_url); }
    });
  }).catch(function () {});

  // ===== 主页设置（后台「主页管理」同步：文案/头像/背景图）=====
